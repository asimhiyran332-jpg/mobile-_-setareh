<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>موبایل ستاره</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:28px 20px;border-radius:0 0 24px 24px}
h1{margin:0 0 8px}.wrap{max-width:600px;margin:auto;padding:18px}
.offer,.card,.info{background:#fff;border-radius:18px;padding:18px;margin:14px 0}
.offer{background:#fff7ed}.offer b{color:#ea580c;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{margin:0}
.icon{font-size:32px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#111827;color:white;font-size:16px}
</style>
</head>
<body>
<header><h1>⭐ موبایل ستاره</h1><div>جدیدترین موبایل‌ها و لوازم جانبی</div></header>
<div class="wrap">
<div class="offer"><b>🔥 ۲۰٪ تخفیف</b><div>روی لوازم جانبی</div></div>
<div class="grid">
<div class="card"><div class="icon">📱</div><h3>موبایل‌ها</h3><div>جدیدترین مدل‌ها</div></div>
<div class="card"><div class="icon">🎧</div><h3>لوازم جانبی</h3><div>انواع لوازم موبایل</div></div>
</div>
<div class="info"><h3>📍 آدرس</h3><p>بازار مرکزی</p><button>📞 تماس با ما</button></div>
</div>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}
</script>
</body>
</html>
